staticServer:
  bindAddress: 0.0.0.0
  insecurePort: 8090
  securePort: 0
  tlsCertFile: ""
  tlsPrivateKey: ""
  path: /tmp/kubeclipper-server/resource
log:
  logFile: ""
  logFileMaxSizeMB: 100
  toStderr: true
  level: debug
  encodeType: console
  maxBackups: 5
  maxAge: 30
  compress: false
  useLocalTime: true
etcd:
  serverList:
    - http://localhost:2379
  keyFile: ""
  certFile: ""
  trustedCAFile: ""
  prefix: "/registry/kc-server"
  paging: true
  compactionInterval: 5m
  countMetricPollPeriod: 1m
  defaultStorageMediaType: "application/json"
  deleteCollectionWorkers: 1
  enableGarbageCollection: true
  enableWatchCache: true
  defaultWatchCacheSize: 100
  #watchCacheSizes
